<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A01923" />
    <script>
      // BESCHERMD (zie CLAUDE.md) — overgenomen uit motrac-template-ui/index.html.
      // Zet het thema vóór de eerste paint (localStorage of systeemvoorkeur),
      // zodat er geen lichte flits is bij het laden in donker thema.
      ;(function () {
        // try/catch alleen om de localStorage-read: ook als die geblokkeerd is
        // (privacy-instellingen) moet de systeemvoorkeur-fallback nog draaien.
        var t = null
        try {
          t = localStorage.getItem('motrac-theme')
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        // Zelfde mapping als THEME_COLOR in ThemeContext — anders is de
        // browser-chrome op mobiel even Linde-rood boven een donkere pagina.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'dark' ? '#18181B' : '#A01923')
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Sales offerte converter · Motrac</title>
    <!-- Inter wordt self-hosted geladen via de stylesheet van @motrac/template-ui;
         innolab-base (FRONTEND_STANDARDS.md) verbiedt een externe font-CDN.
         Alleen de twee gewichten boven de vouw worden voorgeladen: 400 voor
         bodytekst, 600 voor labels/knoppen/navigatie. -->
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-600-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
